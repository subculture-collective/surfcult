# Example channels.toml. Check a file with:
#   surfcult check-config config/channels.example.toml

# IANA time zone name. Grids and time-of-day blocks use it.
timezone = "America/Chicago"

# A channel with one source and one mode.
# mode: sequential | shuffle | weighted | blocks
[[channel]]
number = 3
name = "SATURDAY CARTOONS"
source = { jellyfin_collection = "Cartoons" }
mode = "shuffle"
grid = "30m"                                          # programs start on the half hour; gaps are filled
breaks = { every = "11m", length = "2m", pool = "ads-90s" }
# Add pad = "<pool>" to pad a break the clips leave short from that pool of
# idents and slates before the filler pool:
# breaks = { every = "11m", length = "2m", pool = "ads-90s", pad = "idents" }
filler = "filler"                                     # pool used to fill grid gaps

# Sources: jellyfin_library, jellyfin_collection, jellyfin_tag,
# jellyfin_genre, jellyfin_series.
[[channel]]
number = 4
name = "MOVIE NIGHT"
source = { jellyfin_library = "Movies" }
mode = "sequential"
# No grid: long, irregular programs.
# End each night with one clip, then go off the air. `at` is when the clip
# starts and `until` when the channel comes back, both HH:MM in the time zone
# above; `until` is the next morning when it is not after `at`. `pool` is an
# interstitial pool and `clip` one file name in it; without `clip`, or when
# that file is missing, the pool's first clip plays. No program starts that
# would still be on at `at`. The channel's `filler` pool plays the time
# between; this channel has none, so that time would be dead air.
# sign_off = { at = "23:30", pool = "anthem", clip = "anthem.mp4", until = "06:00" }

# mode = "blocks": time-of-day windows, each with its own source and mode.
# Times are HH:MM in the time zone above and do not cross midnight (use
# "24:00" for the end of the day). Omit `days` for every day. Blocks on the
# same channel must not overlap. Time no block covers plays `default` if it is
# set, and otherwise the channel's `filler` pool.
[[channel]]
number = 5
name = "ALL DAY CARTOONS"
mode = "blocks"
default = { source = { jellyfin_collection = "Cartoons" }, mode = "sequential" }

[[channel.block]]
days = ["sat", "sun"]
start = "06:00"
end = "12:00"
source = { jellyfin_collection = "Cartoons" }
mode = "shuffle"

[[channel.block]]
start = "12:00"
end = "24:00"
source = { jellyfin_genre = "Comedy" }
mode = "weighted"
# mode = "weighted": items whose title is a key play that many times as often
# as the rest, which weigh 1. Weights are whole numbers of at least 1.
weights = { "Groundhog Day" = 3 }

# Display filters (optional). The defaults are shown.
#   filters          on everything on screen: programs, clips, static and the
#                    stand-by card
#   standby_filters  added while the stand-by card shows; a filter already in
#                    `filters` is applied once
#   glitch_every     mean time between glitches of the stand-by card's text
# Filters: crt (a CRT look: scanlines, curvature, colour fringing, flicker,
# a rolling band) and glitch (the card's text tears now and then). An empty
# list turns its filters off.
# [display]
# filters = []
# standby_filters = ["crt", "glitch"]
# glitch_every = "20s"

# Pools of short local clips.
[[interstitial_pool]]
name = "tune-in"
path = "/var/lib/surfcult/clips/tune-in"

[[interstitial_pool]]
name = "ads-90s"
path = "/var/lib/surfcult/clips/ads-90s"
# When the pool fills breaks:
# rotation = "order"     # order: pool order, continuing from break to break (the
#                        # default); shuffle: a new random order for each break
# repeat_after = "2h"    # on one channel, a clip does not air again until 2h after
#                        # its last airing started; without it, only once per break

[[interstitial_pool]]
name = "filler"
path = "/var/lib/surfcult/clips/filler"

# The clip a channel signs off with each night; see `sign_off` above.
[[interstitial_pool]]
name = "anthem"
path = "/var/lib/surfcult/clips/anthem"
