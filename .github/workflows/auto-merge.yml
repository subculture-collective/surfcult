name: Auto-merge

# Merges each ready pull request opened from a branch of this repository
# (squash) once `CI gate` has passed and the branch has no conflicts. Drafts and
# pull requests from forks are left alone. To hold one back, keep it as a draft
# (gh pr ready --undo <number>).
#
# When the default branch enforces `CI gate` (see .github/rulesets/main.json),
# this turns on GitHub auto-merge and GitHub merges after the check passes.
# GitHub cannot enforce required checks on private repositories under the Free
# plan; there this workflow waits for a successful PR CI run and merges itself.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_run:
    workflows: [PR CI]
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Enable auto-merge
    if: >-
      (github.event_name == 'pull_request_target' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASE: ${{ github.event.repository.default_branch }}
      PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
      SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Merge or enable auto-merge
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            echo "No pull request for $SHA."
            exit 0
          fi

          enforced=$(gh api "repos/$GH_REPO/rules/branches/$BASE" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | index("CI gate") != null' \
            2>/dev/null || echo false)
          if [ "$enforced" = true ]; then
            if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
              gh pr merge "$PR" --auto --squash
            fi
            exit 0
          fi

          read -r state draft head < <(gh pr view "$PR" --json state,isDraft,headRefOid --jq '"\(.state) \(.isDraft) \(.headRefOid)"')
          if [ "$state" != OPEN ] || [ "$draft" = true ] || [ "$head" != "$SHA" ]; then
            echo "Pull request #$PR is not open and ready at $SHA; nothing to merge."
            exit 0
          fi
          gate=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs?check_name=CI%20gate" \
            --jq '[.check_runs[].conclusion] | first // "pending"')
          if [ "$gate" != success ]; then
            echo "CI gate is $gate at $SHA; this workflow runs again when PR CI finishes."
            exit 0
          fi
          gh pr merge "$PR" --squash --match-head-commit "$SHA" ||
            [ "$(gh pr view "$PR" --json state --jq .state)" = MERGED ]
