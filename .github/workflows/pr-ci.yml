name: PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Run make verify
        run: make verify

  build-aarch64:
    name: Build aarch64
    timeout-minutes: 30
    # The Raspberry Pi 4B target. A native arm64 runner avoids cross-compiling; Ubuntu 24.04's
    # glibc is older than the Pi's (Debian 13), so the binary runs there.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - name: Build the release binary
        run: cargo build --locked --release
      - name: Check that it is an aarch64 executable
        run: file target/release/surfcult | tee /dev/stderr | grep -q 'ARM aarch64'
      - uses: actions/upload-artifact@v7
        with:
          name: surfcult-aarch64
          path: target/release/surfcult
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: CI gate
    if: always()
    needs: [verify, build-aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {'verify', 'build-aarch64'}
          assert set(results) == expected, results
          for name, result in results.items():
              assert result["result"] == "success", name + " did not pass"
          PY
