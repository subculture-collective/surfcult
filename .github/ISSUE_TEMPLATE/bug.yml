name: Bug report
description: Report behavior that is wrong.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, and what should happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, inputs and versions needed to see the problem. Leave out credentials and private data.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Checkable conditions that show the bug is fixed.
      placeholder: |
        - [ ] make verify passes
    validations:
      required: true
  - type: textarea
    id: test-command
    attributes:
      label: Test command
      description: A command that runs from the repository root and proves the fix.
      placeholder: make verify
      render: shell
