[package]
name = "surfcult"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
chrono = { version = "0.4.45", default-features = false }
chrono-tz = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }
toml = "1.2.2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
