[package]
name = "surfcult"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
chrono-tz = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
